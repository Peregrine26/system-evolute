name: Windows platform

on:
  push:
    branches: [main, c]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    # Keep the runner compatible with the Visual Studio 2022 generator below.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure without Qt
        run: cmake -S . -B build-platform -G "Visual Studio 17 2022" -A x64 -DCROSSDESK_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build-platform --config Debug --parallel
      - name: Test without desktop operations
        run: ctest --test-dir build-platform -C Debug -LE interactive-desktop --output-on-failure --no-tests=error

  qt:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt Widgets
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase'
          cache: 'true'
      - name: Configure with Qt
        run: cmake -S . -B build-qt -G "Visual Studio 17 2022" -A x64 -DCROSSDESK_BUILD_GUI=ON
      - name: Build Qt applications and tests
        run: cmake --build build-qt --config Debug --parallel
      - name: Test without desktop operations
        run: ctest --test-dir build-qt -C Debug -LE interactive-desktop --output-on-failure --no-tests=error
