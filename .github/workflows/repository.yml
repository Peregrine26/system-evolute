name: Repository checks

on:
  push:
    branches: [main, c]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check repository files and change whitespace
        env:
          CROSSDESK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_repository.py --base "$CROSSDESK_BASE_SHA"
      - name: Test repository checks
        run: python -m unittest discover -s tests -p 'test_repository_checks.py' -v
